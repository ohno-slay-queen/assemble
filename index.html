/* =========================================================

/* =========================================================

async function init() {

/* =========================================================
   LOAD MAIN
========================================================= */

async function loadMainSheet() {

  const url =
    MAIN_CSV_URL +
    (
      MAIN_CSV_URL.includes("?")
        ? "&"
        : "?"
    ) +
    "t=" +
    Date.now();


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "ไม่สามารถโหลด main sheet ได้"
    );

  }


  const csvText =
    await response.text();


  return parseCSV(csvText);

}


/* =========================================================
   LOAD CHILD SHEET
========================================================= */

async function loadSheet(
  sheetName
) {

  const url =
    "https://docs.google.com/spreadsheets/d/" +
    SPREADSHEET_ID +
    "/gviz/tq?tqx=out:csv&sheet=" +
    encodeURIComponent(sheetName) +
    "&t=" +
    Date.now();


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      `โหลด sheet ${sheetName} ไม่สำเร็จ`
    );

  }


  const csvText =
    await response.text();


  const rows =
    parseCSV(csvText);


  /*
   * ใช้เฉพาะ:
   *
   * message_id
   * tweet_id
   * text
   *
   * ไม่ใช้:
   *
   * message
   * hashtag
   * status
   */

  return rows

    .map(row => {

      return {

        messageId:
          String(
            row.message_id || ""
          ).trim(),


        tweetId:
          String(
            row.tweet_id || ""
          ).trim(),


        text:
          normalizeText(
            row.text || ""
          )

      };

    })


    .filter(row => {

      return (
        row.messageId &&
        row.text
      );

    });

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(csv) {

  const rows = [];

  let row = [];

  let value = "";

  let insideQuotes = false;


  for (
    let i = 0;
    i < csv.length;
    i++
  ) {

    const char =
      csv[i];


    const next =
      csv[i + 1];


    /*
     * escaped quote:
     * ""
     */
    if (
      char === '"' &&
      insideQuotes &&
      next === '"'
    ) {

      value += '"';

      i++;

      continue;
    }


    /*
     * quote
     */
    if (char === '"') {

      insideQuotes =
        !insideQuotes;

      continue;
    }


    /*
     * comma
     */
    if (
      char === "," &&
      !insideQuotes
    ) {

      row.push(value);

      value = "";

      continue;
    }


    /*
     * newline
     */
    if (
      (
        char === "\n" ||
        char === "\r"
      ) &&
      !insideQuotes
    ) {

      if (
        char === "\r" &&
        next === "\n"
      ) {

        i++;

      }


      row.push(value);

      rows.push(row);


      row = [];

      value = "";

      continue;
    }


    value += char;

  }


  /*
   * Last row
   */
  if (
    value !== "" ||
    row.length > 0
  ) {

    row.push(value);

    rows.push(row);

  }


  if (
    rows.length === 0
  ) {

    return [];

  }


  /*
   * Header
   */
  const headers =
    rows[0].map(
      header =>
        String(header)
          .trim()
          .toLowerCase()
    );


  /*
   * Convert rows → objects
   */
  return rows
    .slice(1)

    .filter(row => {

      return row.some(
        cell =>
          String(cell).trim() !== ""
      );

    })

    .map(row => {

      const obj = {};


      headers.forEach(
        (header, index) => {

          obj[header] =
            String(
              row[index] ?? ""
            ).trim();

        }
      );


      return obj;

    });

}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(
  text
) {

  return String(text)

    /*
     * HTML line break
     */
    .replace(
      /<br\s*\/?>/gi,
      "\n"
    )

    /*
     * HTML paragraph break
     */
    .replace(
      /<\/p>\s*<p>/gi,
      "\n"
    )

    /*
     * remove remaining HTML tags
     */
    .replace(
      /<[^>]*>/g,
      ""
    )

    /*
     * Decode common HTML entities
     */
    .replace(
      /&nbsp;/gi,
      " "
    )

    .replace(
      /&amp;/gi,
      "&"
    )

    .replace(
      /&lt;/gi,
      "<"
    )

    .replace(
      /&gt;/gi,
      ">"
    )

    .trim();

}


/* =========================================================
   POPULATE TOPICS
========================================================= */

function populateTopics() {

  const topics = [
    ...new Set(

      mainRows

        .map(row =>
          String(
            row.topic || ""
          ).trim()
        )

        .filter(Boolean)

    )
  ];


  topicSelect.innerHTML =
    `
      <option value="">
        -- เลือก Topic --
      </option>
    `;


  topics.forEach(topic => {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      topic;


    option.textContent =
      topic;


    topicSelect.appendChild(
      option
    );

  });

}


/* =========================================================
   TOPIC CHANGE
========================================================= */

topicSelect.addEventListener(
  "change",
  async function () {

    currentTopic =
      this.value;


    contentEl.innerHTML =
      "";


    if (!currentTopic) {

      return;

    }


    try {

      setStatus(
        "กำลังโหลดข้อความ..."
      );


      await renderTopic();


      setStatus("");

    }

    catch (error) {

      console.error(error);


      setStatus(
        "เกิดข้อผิดพลาด: " +
        error.message,
        true
      );

    }

  }
);


/* =========================================================
   RENDER TOPIC
========================================================= */

async function renderTopic() {

  /*
   * =========================
   * POST
   * =========================
   */

  const postTitle =
    document.createElement(
      "div"
    );


  postTitle.className =
    "section-title";


  postTitle.textContent =
    "📢 POST";


  contentEl.appendChild(
    postTitle
  );


  const postSheetName =
    `P_${currentTopic}`;


  let postMessages = [];


  try {

    postMessages =
      await loadSheet(
        postSheetName
      );

  }

  catch (error) {

    console.error(error);

    postMessages = [];

  }


  if (
    postMessages.length === 0
  ) {

    const empty =
      createEmpty(
        "ไม่พบข้อความ POST"
      );


    contentEl.appendChild(
      empty
    );

  }

  else {

    const card =
      createPostCard(
        currentTopic,
        postMessages
      );


    contentEl.appendChild(
      card
    );

  }


  /*
   * =========================
   * REPLY
   * =========================
   */

  const replyTitle =
    document.createElement(
      "div"
    );


  replyTitle.className =
    "section-title";


  replyTitle.textContent =
    "💬 REPLY";


  contentEl.appendChild(
    replyTitle
  );


  const tweets =
    getUniqueTweets(
      currentTopic
    );


  if (
    tweets.length === 0
  ) {

    const empty =
      createEmpty(
        "ไม่พบ Tweet สำหรับ Reply"
      );


    contentEl.appendChild(
      empty
    );


    return;

  }


  /*
   * Load reply sheets
   */
  for (
    const tweet of tweets
  ) {

    let messages = [];


    try {

      messages =
        await loadSheet(
          `R_${tweet.tweetId}`
        );

    }

    catch (error) {

      console.error(
        "Reply sheet error:",
        tweet.tweetId,
        error
      );

    }


    const card =
      createReplyCard(
        tweet,
        messages
      );


    contentEl.appendChild(
      card
    );

  }

}


/* =========================================================
   GET UNIQUE TWEETS
========================================================= */

function getUniqueTweets(
  topic
) {

  const map =
    new Map();


  mainRows

    .filter(row => {

      return (
        String(
          row.topic || ""
        ).trim() === topic
      );

    })


    .forEach(row => {

      const tweetId =
        String(
          row.tweet_id || ""
        ).trim();


      if (!tweetId) {

        return;

      }


      if (!map.has(tweetId)) {

        map.set(
          tweetId,
          {

            tweetId,

            accName:
              String(
                row.acc_name || ""
              ).trim(),

            linkPost:
              String(
                row.link_post || ""
              ).trim()

          }
        );

      }

    });


  return [
    ...map.values()
  ];

}

/* =========================================================
   RANDOM POST
========================================================= */

async function randomPost(
  state,
  messageText,
  postBtn,
  remainingCount,
  randomBtn
) {

  if (state.busy) {

    return;

  }


  state.busy = true;

  randomBtn.disabled = true;

  postBtn.disabled = true;


  try {

    /*
     * Get already-used IDs
     */
    const usedIds =
      await getUsedPostMessageIds(
        state.topic
      );


    /*
     * Remove used messages
     */
    const available =
      state.messages.filter(
        message => {

          return !usedIds.has(
            String(
              message.messageId
            )
          );

        }
      );


    if (
      available.length === 0
    ) {

      state.currentMessage =
        null;

      state.remaining = 0;


      messageText.textContent =
        "ข้อความหมดแล้ว";


      messageText.classList.add(
        "message-placeholder"
      );


      updateRemaining(
        remainingCount,
        0
      );


      return;

    }


    /*
     * Shuffle
     */
    shuffle(available);


    /*
     * Try each candidate
     */
    for (
      const message of available
    ) {

      const claimed =
        await claimPostMessage(
          state.topic,
          message.messageId
        );


      /*
       * Another user already claimed it
       */
      if (!claimed) {

        continue;

      }


      /*
       * Success
       */
      state.currentMessage =
        message;


      /*
       * จำนวนที่เหลือ
       * หลังจากข้อความนี้ถูก claim
       */
      state.remaining =
        available.length - 1;


      messageText.textContent =
        message.text;


      messageText.classList.remove(
        "message-placeholder"
      );


      postBtn.disabled =
        false;


      updateRemaining(
        remainingCount,
        state.remaining
      );


      return;

    }


    /*
     * All candidates were taken
     */
    state.currentMessage =
      null;


    state.remaining = 0;


    messageText.textContent =
      "ข้อความถูกใช้งานหมดแล้ว กรุณากดสุ่มใหม่";


    messageText.classList.add(
      "message-placeholder"
    );


    updateRemaining(
      remainingCount,
      0
    );

  }

  catch (error) {

    console.error(error);


    alert(
      "สุ่มข้อความไม่สำเร็จ\n\n" +
      error.message
    );

  }

  finally {

    state.busy =
      false;

    randomBtn.disabled =
      false;

  }

}


/* =========================================================
   RANDOM REPLY
========================================================= */

async function randomReply(
  state,
  messageText,
  replyBtn,
  remainingCount,
  randomBtn
) {

  if (state.busy) {

    return;

  }


  state.busy = true;

  randomBtn.disabled = true;

  replyBtn.disabled = true;


  try {

    /*
     * Get used IDs
     */
    const usedIds =
      await getUsedReplyMessageIds(
        state.tweetId
      );


    /*
     * Remove used
     */
    const available =
      state.messages.filter(
        message => {

          return !usedIds.has(
            String(
              message.messageId
            )
          );

        }
      );


    if (
      available.length === 0
    ) {

      state.currentMessage =
        null;

      state.remaining = 0;


      messageText.textContent =
        "ข้อความหมดแล้ว";


      messageText.classList.add(
        "message-placeholder"
      );

        remainingCount,
        0
      );


      return;

    }


    /*
     * Shuffle
     */
    shuffle(available);


    /*
     * Atomic claim
     */
    for (
      const message of available
    ) {

      const claimed =
        await claimReplyMessage(
          state.tweetId,
          message.messageId
        );


      /*
       * Somebody else claimed it
       */
      if (!claimed) {

        continue;

      }


      /*
       * Success

      state.currentMessage =

      );

    }


    /*

     */
    state.currentMessage =

    state.remaining = 0;


    messageText.textContent =

      error.message
    );

  }

  finally {

    state.busy =
      false;

    randomBtn.disabled =
      false;

  }

}


/* =========================================================
   GET USED POST IDs
========================================================= */

async function getUsedPostMessageIds(
  topic
) {

  const url =
    SUPABASE_URL +
    "/rest/v1/used_post_messages" +
    "?select=message_id" +
    "&topic=eq." +
    encodeURIComponent(
      topic
    );


  const response =
    await fetch(
      url,
      {
        method: "GET",

        headers: {

          apikey:
            SUPABASE_KEY,

          Authorization:
            "Bearer " +
            SUPABASE_KEY

        }

      }
    );


  if (!response.ok) {

    const text =
      await response.text();


    throw new Error(
      "โหลด used POST messages ไม่สำเร็จ: " +
      text
    );

  }


  const rows =
    await response.json();


  return new Set(

    rows.map(
      row =>
        String(
          row.message_id
        )
    )

  );

}

/* =========================================================
   COPY
========================================================= */

async function copyText(
  text
) {

  try {

    await navigator.clipboard.writeText(
      text
    );


    alert(
      "Copy แล้ว"
    );

  }

  catch (error) {

    /*
     * Fallback
     */
    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      text;


    textarea.style.position =
      "fixed";


    textarea.style.opacity =
      "0";


    document.body.appendChild(
      textarea
    );


    textarea.focus();

    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();


    alert(
      "Copy แล้ว"
    );

  }

}


/* =========================================================
   MASK TWEET ID
========================================================= */

function maskTweetId(
  tweetId
) {

  const id =
    String(
      tweetId
    );


  if (
    id.length <= 4
  ) {

    return (
      "••••" +
      id
    );

  }


  return (
    "••••••••" +
    id.slice(-4)
  );

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(
  array
) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }


  return array;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
) {

  return String(
    value
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   UPDATE REMAINING
========================================================= */

function updateRemaining(
  element,
  count
) {

  element.textContent =
    count;

}


/* =========================================================

function createEmpty(
  message
) {

  const element =

  element.className =
    "empty";


  element.textContent =

  return element;
