<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>X Message Randomizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
    }

    .topic-select {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      margin-bottom: 20px;
    }

    .section-title {
      margin-top: 28px;
      margin-bottom: 12px;
      font-size: 20px;
      font-weight: 700;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .account {
      font-weight: 700;
      font-size: 15px;
    }

    .tweet-id {
      font-size: 13px;
      color: #777;
      margin-top: 4px;
    }

    .remaining {
      font-size: 13px;
      color: #555;
      margin-bottom: 10px;
    }

    .message-box {
      position: relative;
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 14px;
      min-height: 100px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .message-placeholder {
      color: #999;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      border: none;
      background: white;
      border: 1px solid #ddd;
      border-radius: 7px;
      padding: 5px 9px;
      cursor: pointer;
      font-size: 12px;
    }

    .copy-btn:hover {
      background: #eee;
    }

    .message-text {
      padding-right: 55px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .random-btn {
      background: #111;
      color: white;
    }

    .random-btn:hover {
      background: #333;
    }

    .post-btn,
    .reply-btn {
      background: #1d9bf0;
      color: white;
    }

    .post-btn:hover,
    .reply-btn:hover {
      background: #1687d1;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .error {
      background: #ffe5e5;
      color: #b00020;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }

    .empty {
      background: white;
      padding: 20px;
      border-radius: 12px;
      color: #777;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎲 X Message Randomizer</h1>

    <select
      id="topic-select"
      class="topic-select"
    >
      <option value="">กำลังโหลด Topic...</option>
    </select>

    <div id="error-container"></div>

    <div id="content"></div>

  </div>


  <script>

    /* =====================================================
       CONFIG
    ===================================================== */

    // URL CSV ของ sheet "main"
    const MAIN_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-CnwPK2fSRjsBrmWn3XVIXZEbDFPGguJQeco7B4nNv-7YOcxmIk0ge1846CC5OB8o3sqWK7TwIo_a/pub?output=csv";

    // Spreadsheet ID
    const SPREADSHEET_ID =
      "1RJ7OzLLgvMSKdVTxVfKOqQXir7vXIIyWpa_gImp1PzM";

    // Supabase
    const SUPABASE_URL =
      "https://romrjbyaqckrpvobbzkw.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_4DN0Penjs0vuTYzVdY4-Ug_AmsxurCE";


    /* =====================================================
       GLOBAL STATE
    ===================================================== */

    let mainRows = [];

    let topics = [];

    const topicStates = {};


    /* =====================================================
       DOM
    ===================================================== */

    const topicSelect =
      document.getElementById("topic-select");

    const content =
      document.getElementById("content");

    const errorContainer =
      document.getElementById("error-container");


    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        try {

          await loadMainSheet();

          buildTopicList();

        } catch (error) {

          console.error(error);

          showError(
            "โหลดข้อมูลไม่สำเร็จ\n" +
            error.message
          );

        }

      }
    );


    /* =====================================================
       LOAD MAIN SHEET
    ===================================================== */

    async function loadMainSheet() {

      if (
        !MAIN_CSV_URL ||
        MAIN_CSV_URL.includes("ใส่_URL")
      ) {
        throw new Error(
          "กรุณาใส่ MAIN_CSV_URL"
        );
      }

      const response =
        await fetch(MAIN_CSV_URL);

      if (!response.ok) {

        throw new Error(
          `โหลด main sheet ไม่สำเร็จ: ${response.status}`
        );

      }

      const csvText =
        await response.text();

      mainRows =
        parseCSV(csvText);

    }


    /* =====================================================
       BUILD TOPIC LIST
    ===================================================== */

    function buildTopicList() {

      const topicSet =
        new Set();

      mainRows.forEach(row => {

        const topic =
          String(row.topic || "").trim();

        if (topic) {

          topicSet.add(topic);

        }

      });

      topics =
        Array.from(topicSet);

      topicSelect.innerHTML =
        `<option value="">
          เลือก Topic
        </option>`;

      topics.forEach(topic => {

        const option =
          document.createElement("option");

        option.value =
          topic;

        option.textContent =
          topic;

        topicSelect.appendChild(option);

      });

    }


    /* =====================================================
       TOPIC CHANGE
    ===================================================== */

    topicSelect.addEventListener(
      "change",
      async () => {

        const topic =
          topicSelect.value;

        content.innerHTML = "";

        clearError();

        if (!topic) {

          return;

        }

        try {

          await loadTopic(topic);

        } catch (error) {

          console.error(error);

          showError(
            "โหลด Topic ไม่สำเร็จ\n" +
            error.message
          );

        }

      }
    );


    /* =====================================================
       LOAD TOPIC
    ===================================================== */

    async function loadTopic(topic) {

      content.innerHTML =
        `<div class="loading">
          กำลังโหลดข้อมูล...
        </div>`;


      /*
       * ---------------------------------------------------
       * POST
       * ---------------------------------------------------
       */

      const postRows =
        await loadChildSheet(
          `P_${topic}`
        );


      /*
       * ---------------------------------------------------
       * REPLY
       * ---------------------------------------------------
       */

      const replyTweets =
        getReplyTweets(topic);


      content.innerHTML = "";


      /*
       * POST SECTION
       */

      const postTitle =
        document.createElement("div");

      postTitle.className =
        "section-title";

      postTitle.textContent =
        "POST";

      content.appendChild(
        postTitle
      );


      if (postRows.length === 0) {

        const empty =
          document.createElement("div");

        empty.className =
          "empty";

        empty.textContent =
          "ไม่พบข้อความ POST";

        content.appendChild(
          empty
        );

      } else {

        const postCard =
          createPostCard(
            topic,
            postRows
          );

        content.appendChild(
          postCard
        );

      }


      /*
       * REPLY SECTION
       */

      const replyTitle =
        document.createElement("div");

      replyTitle.className =
        "section-title";

      replyTitle.textContent =
        "REPLY";

      content.appendChild(
        replyTitle
      );


      if (replyTweets.length === 0) {

        const empty =
          document.createElement("div");

        empty.className =
          "empty";

        empty.textContent =
          "ไม่พบ Tweet สำหรับ REPLY";

        content.appendChild(
          empty
        );

      } else {

        for (
          const tweet of replyTweets
        ) {

          const card =
            await createReplyCard(
              topic,
              tweet
            );

          content.appendChild(
            card
          );

        }

      }

    }


    /* =====================================================
       GET REPLY TWEETS FROM MAIN
    ===================================================== */

    function getReplyTweets(topic) {

      const map =
        new Map();


      mainRows
        .filter(row =>
          String(row.topic || "").trim()
          === topic
        )
        .forEach(row => {

          const tweetId =
            String(
              row.tweet_id || ""
            ).trim();

          if (!tweetId) {

            return;

          }


          if (!map.has(tweetId)) {

            map.set(
              tweetId,
              {
                tweetId,
                accName:
                  String(
                    row.acc_name || ""
                  ).trim()
              }
            );

          }

        });


      return Array.from(
        map.values()
      );

    }


    /* =====================================================
       CREATE POST CARD
    ===================================================== */

    function createPostCard(
      topic,
      rows
    ) {

      const messages =
        rows
          .map(row => ({
            messageId:
              String(
                row.message_id || ""
              ).trim(),

            text:
              normalizeText(
                row.text || ""
              )
          }))
          .filter(
            row =>
              row.messageId &&
              row.text
          );


      const state = {

        topic,

        messages,

        currentMessage: null,

        remaining: messages.length,

        isRandomizing: false

      };


      const card =
        document.createElement("div");

      card.className =
        "card";


      card.innerHTML = `

        <div class="card-header">

          <div class="account">
            POST
          </div>

        </div>


        <div class="remaining">
          message ที่เหลือ:
          <span class="remaining-count">
            กำลังโหลด...
          </span>
        </div>


        <div class="message-box">

          <button
            class="copy-btn"
            type="button"
          >
            📋 Copy
          </button>

          <div class="message-text">
            <span class="message-placeholder">
              กด 🎲 สุ่มข้อความ
            </span>
          </div>

        </div>


        <div class="actions">

          <button
            class="random-btn"
            type="button"
          >
            🎲 สุ่มข้อความ
          </button>

          <button
            class="post-btn"
            type="button"
            disabled
          >
            Post
          </button>

        </div>

      `;


      const remainingCount =
        card.querySelector(
          ".remaining-count"
        );

      const messageText =
        card.querySelector(
          ".message-text"
        );

      const copyBtn =
        card.querySelector(
          ".copy-btn"
        );

      const randomBtn =
        card.querySelector(
          ".random-btn"
        );

      const postBtn =
        card.querySelector(
          ".post-btn"
        );


      /*
       * ---------------------------------------------------
       * INITIAL GLOBAL COUNT
       * ---------------------------------------------------
       */

      initializePostRemaining(
        state,
        remainingCount
      );


      /*
       * ---------------------------------------------------
       * RANDOM
       * ---------------------------------------------------
       */

      randomBtn.addEventListener(
        "click",
        async () => {

          if (
            state.isRandomizing
          ) {

            return;

          }


          state.isRandomizing =
            true;

          randomBtn.disabled =
            true;


          try {

            const result =
              await claimRandomPost(
                state
              );


            if (!result) {

              messageText.innerHTML = `
                <span class="message-placeholder">
                  ข้อความหมดแล้ว
                </span>
              `;

              postBtn.disabled =
                true;

              return;

            }


            state.currentMessage =
              result;


            messageText.textContent =
              result.text;


            postBtn.disabled =
              false;


            /*
             * Refresh count from Supabase
             */

            await refreshPostRemaining(
              state,
              remainingCount
            );


          } catch (error) {

            console.error(error);

            showError(
              "สุ่มข้อความ POST ไม่สำเร็จ\n" +
              error.message
            );

          } finally {

            state.isRandomizing =
              false;

            randomBtn.disabled =
              state.remaining <= 0;

          }

        }
      );


      /*
       * ---------------------------------------------------
       * COPY
       * ---------------------------------------------------
       */

      copyBtn.addEventListener(
        "click",
        async () => {

          if (
            !state.currentMessage
          ) {

            return;

          }


          try {

            await navigator.clipboard.writeText(
              state.currentMessage.text
            );

            copyBtn.textContent =
              "✓ Copied";

            setTimeout(
              () => {

                copyBtn.textContent =
                  "📋 Copy";

              },
              1000
            );

          } catch (error) {

            console.error(error);

            showError(
              "Copy ไม่สำเร็จ"
            );

          }

        }
      );


      /*
       * ---------------------------------------------------
       * POST TO X
       * ---------------------------------------------------
       */

      postBtn.addEventListener(
        "click",
        () => {

          if (
            !state.currentMessage
          ) {

            return;

          }


          const url =
            createPostUrl(
              state.currentMessage.text
            );


          window.open(
            url,
            "_blank"
          );

        }
      );


      return card;

    }


    /* =====================================================
       CREATE REPLY CARD
    ===================================================== */

          message ที่เหลือ:

        <div class="message-box">

          <button
            class="copy-btn"

            📋 Copy

          <div class="message-text">

        <div class="actions">

      randomBtn.addEventListener(

              `;

              return;

            }


            state.currentMessage =
              result;


            messageText.textContent =

                copyBtn.textContent =
                  "📋 Copy";

       */

      replyBtn.addEventListener(
        "click",

          if (
            !state.currentMessage
          ) {

            return;

          }

            createReplyUrl(

    /* =====================================================
       INITIAL POST COUNT
    ===================================================== */

    async function initializePostRemaining(
      state,
      remainingElement
    ) {

      try {

        const usedIds =
          await getUsedPostMessageIds(
            state.topic
          );


        state.remaining =
          Math.max(
            state.messages.length -
            usedIds.size,
            0
          );


        updateRemaining(
          remainingElement,
          state.remaining,
          state.messages.length
        );


      } catch (error) {

        console.error(
          "โหลดจำนวน POST ที่เหลือไม่สำเร็จ:",
          error
        );


        /*
         * ถ้า Supabase โหลดไม่ได้
         * ไม่ควรโกหกว่าจำนวนเป็น total/total
         */

        remainingElement.textContent =
          "โหลดไม่ได้";

      }

    }


    /* =====================================================
       INITIAL REPLY COUNT
    ===================================================== */

    async function initializeReplyRemaining(
      state,
      remainingElement
    ) {

      try {

        const usedIds =
          await getUsedReplyMessageIds(
            state.tweetId
          );


        state.remaining =
          Math.max(
            state.messages.length -
            usedIds.size,
            0
          );


        updateRemaining(
          remainingElement,
          state.remaining,
          state.messages.length
        );


      } catch (error) {

        console.error(
          "โหลดจำนวน REPLY ที่เหลือไม่สำเร็จ:",
          error
        );


        remainingElement.textContent =
          "โหลดไม่ได้";

      }

    }


    /* =====================================================
       REFRESH POST COUNT
    ===================================================== */

    async function refreshPostRemaining(
      state,
      remainingElement
    ) {

      const usedIds =
        await getUsedPostMessageIds(
          state.topic
        );


      state.remaining =
        Math.max(
          state.messages.length -
          usedIds.size,
          0
        );


      updateRemaining(
        remainingElement,
        state.remaining,
        state.messages.length
      );

    }


    /* =====================================================
       REFRESH REPLY COUNT
    ===================================================== */

    async function refreshReplyRemaining(
      state,
      remainingElement
    ) {

      const usedIds =
        await getUsedReplyMessageIds(
          state.tweetId
        );


      state.remaining =
        Math.max(
          state.messages.length -
          usedIds.size,
          0
        );


      updateRemaining(
        remainingElement,
        state.remaining,
        state.messages.length
      );

    }


    /* =====================================================
       GET USED POST MESSAGE IDS
    ===================================================== */

    async function getUsedPostMessageIds(
      topic
    ) {

      const url =
        SUPABASE_URL +
        "/rest/v1/used_post_messages_v2" +
        "?select=message_id" +
        "&topic=eq." +
        encodeURIComponent(topic);


      const response =
        await fetch(
          url,
          {
            method: "GET",

            headers: {
              apikey:
                SUPABASE_KEY,

              Authorization:
                `Bearer ${SUPABASE_KEY}`
            }
          }
        );


      if (!response.ok) {

        throw new Error(
          `Supabase POST GET failed: ${response.status}`
        );

      }


      const rows =
        await response.json();


      return new Set(
        rows.map(
          row =>
            String(
              row.message_id
            ).trim()
        )
      );

    }


    /* =====================================================
       GET USED REPLY MESSAGE IDS
    ===================================================== */

    async function getUsedReplyMessageIds(
      tweetId
    ) {

      const url =
        SUPABASE_URL +
        "/rest/v1/used_reply_messages_v2" +
        "?select=message_id" +
        "&tweet_id=eq." +
        encodeURIComponent(tweetId);


      const response =
        await fetch(
          url,
          {
            method: "GET",

            headers: {
              apikey:
                SUPABASE_KEY,

              Authorization:
                `Bearer ${SUPABASE_KEY}`
            }
          }
        );


      if (!response.ok) {

        throw new Error(
          `Supabase REPLY GET failed: ${response.status}`
        );

      }


      const rows =
        await response.json();


      return new Set(
        rows.map(
          row =>
            String(
              row.message_id
            ).trim()
        )
      );

    }


    /* =====================================================
       CLAIM RANDOM POST
    ===================================================== */

    async function claimRandomPost(
      state
    ) {

      /*
       * Get globally used messages
       */

      let usedIds =
        await getUsedPostMessageIds(
          state.topic
        );


      /*
       * Candidate messages
       */

      let available =
        state.messages.filter(
          message =>
            !usedIds.has(
              message.messageId
            )
        );


      /*
       * No messages
       */

      if (
        available.length === 0
      ) {

        state.remaining = 0;

        return null;

      }


      /*
       * Shuffle candidates
       */

      shuffle(available);


      /*
       * Try claiming one by one.
       *
       * If another user claimed it
       * at the same time, claim returns false.
       * Then try another candidate.
       */

      for (
        const message of available
      ) {

        const success =
          await claimPostMessage(
            state.topic,
            message.messageId
          );


        if (success) {

          return message;

        }


        /*
         * Someone else claimed it.
         * Remove and retry.
         */

        usedIds.add(
          message.messageId
        );

      }


      /*
       * Everything was claimed
       */

      state.remaining = 0;

      return null;

    }


    /* =====================================================
       CLAIM RANDOM REPLY
    ===================================================== */

    async function claimRandomReply(
      state
    ) {

      let usedIds =
        await getUsedReplyMessageIds(
          state.tweetId
        );


      let available =
        state.messages.filter(
          message =>
            !usedIds.has(
              message.messageId
            )
        );


      if (
        available.length === 0
      ) {

        state.remaining = 0;

        return null;

      }


      shuffle(available);


      for (
        const message of available
      ) {

        const success =
          await claimReplyMessage(
            state.tweetId,
            message.messageId
          );


        if (success) {

          return message;

        }


        usedIds.add(
          message.messageId
        );

      }


      state.remaining = 0;

      return null;

    }


    /* =====================================================
       CLAIM POST MESSAGE
    ===================================================== */

    async function claimPostMessage(
      topic,
      messageId
    ) {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/rpc/claim_post_message_v2",
          {
            method: "POST",

            headers: {
              apikey:
                SUPABASE_KEY,

              Authorization:
                `Bearer ${SUPABASE_KEY}`,

              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              p_topic:
                topic,

              p_message_id:
                messageId

            })
          }
        );


      if (!response.ok) {

        throw new Error(
          `Claim POST failed: ${response.status}`
        );

      }


      return await response.json();

    }


    /* =====================================================
       CLAIM REPLY MESSAGE
    ===================================================== */

    async function claimReplyMessage(

    /* =====================================================
       LOAD CHILD SHEET
    ===================================================== */

    async function loadChildSheet(
      sheetName
    ) {

      const url =
        `https://docs.google.com/spreadsheets/d/` +
        `${SPREADSHEET_ID}/gviz/tq` +
        `?sheet=${encodeURIComponent(sheetName)}` +
        `&tqx=out:csv`;


      const response =
        await fetch(url);


      if (!response.ok) {

        throw new Error(
          `โหลด sheet ${sheetName} ไม่สำเร็จ: ${response.status}`
        );

      }


      const csvText =
        await response.text();


      return parseCSV(
        csvText
      );

    }


    /* =====================================================
       CSV PARSER
    ===================================================== */

    function parseCSV(
      csv
    ) {

      const rows = [];

      let row = [];

      let field = "";

      let insideQuotes = false;


      for (
        let i = 0;
        i < csv.length;
        i++
      ) {

        const char =
          csv[i];


        const next =
          csv[i + 1];


        if (
          char === '"'
        ) {

          if (
            insideQuotes &&
            next === '"'
          ) {

            field += '"';

            i++;

          } else {

            insideQuotes =
              !insideQuotes;

          }

        } else if (
          char === "," &&
          !insideQuotes
        ) {

          row.push(field);

          field = "";

        } else if (
          (char === "\n" ||
           char === "\r") &&
          !insideQuotes
        ) {

          if (
            char === "\r" &&
            next === "\n"
          ) {

            i++;

          }


          row.push(field);

          rows.push(row);

          row = [];

          field = "";

        } else {

          field += char;

        }

      }


      /*
       * Last field
       */

      if (
        field !== "" ||
        row.length > 0
      ) {

        row.push(field);

        rows.push(row);

      }


      if (
        rows.length === 0
      ) {

        return [];

      }


      /*
       * Header
       */

      const headers =
        rows[0].map(
          header =>
            normalizeHeader(
              header
            )
        );


      /*
       * Convert rows to objects
       */

      return rows
        .slice(1)
        .filter(
          row =>
            row.some(
              value =>
                String(
                  value || ""
                ).trim() !== ""
            )
        )
        .map(row => {

          const obj = {};


          headers.forEach(
            (header, index) => {

              if (!header) {

                return;

              }


              obj[header] =
                String(
                  row[index] || ""
                ).trim();

            }
          );


          return obj;

        });

    }


    /* =====================================================
       NORMALIZE HEADER
    ===================================================== */

    function normalizeHeader(
      value
    ) {

      return String(
        value || ""
      )
        .replace(
          /^\uFEFF/,
          ""
        )
        .trim()
        .toLowerCase()
        .replace(
          /\s+/g,
          "_"
        );

    }


    /* =====================================================
       NORMALIZE TEXT
    ===================================================== */

    function normalizeText(
      text
    ) {

      return String(
        text || ""
      )

        .replace(
          /<br\s*\/?>/gi,
          "\n"
        )

        .replace(
          /<\/p>\s*<p>/gi,
          "\n"
        )

        .replace(
          /<[^>]*>/g,
          ""
        )

        .replace(
          /&nbsp;/gi,
          " "
        )

        .replace(
          /&amp;/gi,
          "&"
        )

        .replace(
          /&lt;/gi,
          "<"
        )

        .replace(
          /&gt;/gi,
          ">"
        )

        .trim();

    }


    /* =====================================================
       UPDATE REMAINING
    ===================================================== */

    function updateRemaining(
      element,
      remaining,
      total
    ) {

      element.textContent =
        `${remaining}/${total}`;

    }


    /* =====================================================
       MASK TWEET ID
    ===================================================== */

    function maskTweetId(
      tweetId
    ) {

      const value =
        String(tweetId);


      if (
        value.length <= 4
      ) {

        return "••••";

      }


      return (
        "••••••••" +
        value.slice(-4)
      );

    }


    /* =====================================================
       X POST URL
    ===================================================== */

    function createPostUrl(
      text
    ) {

      return (
        "https://x.com/intent/post" +
        "?text=" +
        encodeURIComponent(text)
      );

    }


    /* =====================================================
       X REPLY URL
    ===================================================== */

    function createReplyUrl(
      tweetId,
      text
    ) {

      return (
        "https://x.com/intent/tweet" +
        "?in_reply_to=" +
        encodeURIComponent(tweetId) +
        "&text=" +
        encodeURIComponent(text)
      );

    }


    /* =====================================================
       SHUFFLE
    ===================================================== */

    function shuffle(
      array
    ) {

      for (
        let i = array.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );


        [
          array[i],
          array[j]
        ] = [
          array[j],
          array[i]
        ];

      }


      return array;

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(
      message
    ) {

      errorContainer.innerHTML =
        `<div class="error">
          ${escapeHtml(message)}
        </div>`;

    }


    function clearError() {

      errorContainer.innerHTML = "";

    }

  </script>
